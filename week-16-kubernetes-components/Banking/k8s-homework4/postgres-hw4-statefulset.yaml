apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-hw4
spec:
  serviceName: postgres-hw4-headless
  replicas: 3

  selector:
    matchLabels:
      app: postgres-hw4

  template:
    metadata:
      labels:
        app: postgres-hw4

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              value: bankingdatabase

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: "7878"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi