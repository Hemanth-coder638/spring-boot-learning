apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: hemanths5454/ecommerce-inventory-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
          requests:
             memory: "200Mi"
             cpu: "100m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USER
            valueFrom:
             secretKeyRef:
               name: my-secret
               key: INVENTORY_DB_USER

          - name: DB_PASSWORD
            valueFrom:
             secretKeyRef:
               name: my-secret
               key: INVENTORY_DB_PASSWORD

          - name: DB_SERVICE
            valueFrom:
             configMapKeyRef:
               name: my-config
               key: INVENTORY_DB_SERVICE
               
          - name: CONFIG_SERVER_URL
            value: http://config-server:8888
        ports:
        - containerPort: 9011

---

apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
  - port: 9011
    targetPort: 9011

