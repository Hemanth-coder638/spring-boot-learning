apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-order-external-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: doppler-store
    kind: SecretStore

  target:
    name: my-secret
    creationPolicy: Owner

  data:
    - secretKey: INVENTORY_DB_NAME
      remoteRef:
        key: INVENTORY_DB_NAME

    - secretKey: INVENTORY_DB_USER
      remoteRef:
        key: INVENTORY_DB_USER

    - secretKey: INVENTORY_DB_PASSWORD
      remoteRef:
        key: INVENTORY_DB_PASSWORD

    - secretKey: ORDER_DB_NAME
      remoteRef:
        key: ORDER_DB_NAME

    - secretKey: ORDER_DB_USER
      remoteRef:
        key: ORDER_DB_USER

    - secretKey: ORDER_DB_PASSWORD
      remoteRef:
        key: ORDER_DB_PASSWORD