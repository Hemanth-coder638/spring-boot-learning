apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
spec:
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      containers:
      - name: shipping-service
        image: hemanths5454/ecommerce-shipping-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
          requests:
             memory: "200Mi"
             cpu: "100m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: CONFIG_SERVER_URL
            value: http://config-server:8888
        ports:
        - containerPort: 4321

---

apiVersion: v1
kind: Service
metadata:
  name: shipping-service
spec:
  selector:
    app: shipping-service
  ports:
  - port: 4321
    targetPort: 4321

