apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway

spec:
  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: hemanths5454/ecommerce-api-gateway
          imagePullPolicy: Always

          resources:
            limits:
              memory: "500Mi"
              cpu: "200m"
            requests:
              memory: "100Mi"
              cpu: "100m"

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s

            - name: CONFIG_SERVER_URL
              value: http://config-server:8888

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    cloud.google.com/backend-config: '{"ports":{"80":"api-gateway-backendconfig"}}'

spec:
  selector:
    app: api-gateway

  ports:
    - port: 80
      targetPort: 8080