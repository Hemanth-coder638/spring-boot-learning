apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: hemanths5454/ecommerce-order-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
          requests:
             memory: "200Mi"
             cpu: "100m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USER
            valueFrom:
             secretKeyRef:
               name: my-secret
               key: ORDER_DB_USER

          - name: DB_PASSWORD
            valueFrom:
             secretKeyRef:
               name: my-secret
               key: ORDER_DB_PASSWORD
               
          - name: DB_SERVICE
            valueFrom:
             configMapKeyRef:
               name: my-config
               key: ORDER_DB_SERVICE
          - name: CONFIG_SERVER_URL
            value: http://config-server:8888
        ports:
        - containerPort: 9021

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - port: 9021
    targetPort: 9021

